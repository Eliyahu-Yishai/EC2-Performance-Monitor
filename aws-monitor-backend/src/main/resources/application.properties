spring.application.name=aws-monitor
server.port=8080

# ============================================
# SAFETY GUARD CONFIGURATION
# ============================================
# This system is designed to be READ-ONLY by default.
# It monitors AWS EC2 instances but does NOT perform destructive operations.
#
# IMPORTANT: Do NOT enable this flag in production unless you have a specific
# use case that requires EC2 instance termination capabilities.
#
# To enable destructive operations (NOT RECOMMENDED):
#   Set: aws.safety.allow-instance-termination=true
#   Or via environment: AWS_SAFETY_ALLOW_INSTANCE_TERMINATION=true
#
aws.safety.allow-instance-termination=false
